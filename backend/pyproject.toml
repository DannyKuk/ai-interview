[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the AI interview practice app"
readme = "README.md"
authors = [
    { name = "Danny", email = "danny.kukic.priv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-openrouter>=0.2.9",
    "limits>=5.8.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
